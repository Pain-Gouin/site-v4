{% load static %}

<div class="shuffle">
  {% for contact in contacts %}
    <a target="_blank"
       href="{{ contact.messenger_url }}"
       class="m-1 flex items-center gap-4 p-2 rounded-3xl hover:bg-blue-100 border-2 border-blue-500">
      <img height="40px"
           width="40px"
           src="{% static 'externe/messenger.svg' %}"
           alt="logo messenger" />
      <div class="font-medium dark:text-white">
        <div>{{ contact.name }}</div>
        <div class="text-sm text-gray-500 dark:text-gray-400">{{ contact.role }}</div>
      </div>
    </a>
  {% endfor %}
  <script>
    const container = document.querySelector(".shuffle");
    const divs = Array.from(container.children);

    // Shuffle
    for (let i = divs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [divs[i], divs[j]] = [divs[j], divs[i]];
    }

    divs.forEach(div => container.appendChild(div));
  </script>
</div>
